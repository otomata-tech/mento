[project]
name = "mento"
version = "3.0.0"
description = "Record meetings (mic and system audio on separate tracks) and transcribe them with speaker diarization."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexis Laporte" }]
requires-python = ">=3.10"
dependencies = [
    "soundcard>=0.4.3",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
    "platformdirs>=4",
    "httpx>=0.27",
    # Panel icon on Windows and macOS; Linux uses AppIndicator from the system Python
    "pystray>=0.19; sys_platform != 'linux'",
    "pillow>=10; sys_platform != 'linux'",
]

[project.urls]
Homepage = "https://github.com/AlexisLaporte/audio-recorder"

[project.scripts]
mento = "mento.cli:main"

[project.gui-scripts]
# Windowless launcher for the panel icon (Windows Startup folder, macOS login item)
mento-tray = "mento.tray:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
